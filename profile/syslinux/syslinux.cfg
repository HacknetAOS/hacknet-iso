UI menu.c32
PROMPT 0
MENU TITLE HacknetOS
TIMEOUT 100
DEFAULT installer

# Colours follow the desktop chrome: black ground, grey text, lavender accent,
# purple selection bar. (syslinux wants "fg/bg" as ANSI pair + display colour.)
MENU COLOR screen       30;40   #ffc0c8d0 #00000000 std
MENU COLOR border       30;44   #ff2b3b52 #00000000 std
MENU COLOR title        1;36;44 #ffb9a6ff #00000000 std
MENU COLOR sel          7;37;40 #ffffffff #ff2e2344 all
MENU COLOR unsel        37;44   #ff9aa0ab #00000000 std
MENU COLOR help         37;40   #ff79808f #00000000 std
MENU COLOR timeout_msg  37;40   #ff79808f #00000000 std
MENU COLOR timeout      1;37;40 #ffb9a6ff #00000000 std
MENU COLOR msg07        37;40   #ff9aa0ab #00000000 std
MENU COLOR tabmsg       31;40   #ff79808f #00000000 std
MENU COLOR hotkey       1;37;40 #ffb9a6ff #00000000 std

LABEL installer
    MENU LABEL HacknetOS Installer
    LINUX /arch/boot/x86_64/vmlinuz-linux
    INITRD /arch/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=arch archisolabel=%ARCHISO_LABEL% loglevel=5 nowatchdog console=tty0 console=ttyS0

LABEL autoinstall
    MENU LABEL HacknetOS Installer (unattended)
    LINUX /arch/boot/x86_64/vmlinuz-linux
    INITRD /arch/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=arch archisolabel=%ARCHISO_LABEL% loglevel=5 nowatchdog console=tty0 console=ttyS0 hacknetos.autoinstall=1 hacknetos.disk=auto hacknetos.user=alice hacknetos.password=hacknet

LABEL reboot
    MENU LABEL Reboot
    COM32 reboot.c32
