title HacknetOS Installer (unattended)
linux /arch/boot/x86_64/vmlinuz-linux
initrd /arch/boot/x86_64/initramfs-linux.img
options archisobasedir=arch archisolabel=%ARCHISO_LABEL% loglevel=5 nowatchdog console=tty0 console=ttyS0 hacknetos.autoinstall=1 hacknetos.disk=auto hacknetos.user=alice hacknetos.password=hacknet
