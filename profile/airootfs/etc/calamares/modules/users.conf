---
# HacknetOS users module
module: "users"
defaultGroups: "wheel,network,video,audio,input,storage,power,lp,scanner"
autologinGroup: "autologin"
sudoersGroup: "wheel"
setRootPassword: true
availableShells: "/bin/bash,/bin/zsh,/usr/bin/fish"
defaultShell: "/bin/bash"
avatarPath: "/usr/share/icons/hacknetos/avatar.png"