---
# HacknetOS Calamares main settings
sequence:
    - show:
        - welcome
        - locale
        - keyboard
        - partition
        - users
        - summary
    - exec:
        - install
        - bootloader
        - users
    - show:
        - finished

# Required storage for installation (MB)
requiredStorage: 8192

# Required RAM for installation (MB)
requiredRam: 1024

# Modules to use
modules-search: [local, system]

# Branding
branding: "hacknetos"

# Window expand
windowExpanding: true
windowSize: "800x600"

# Locale
locale: en_US.UTF-8