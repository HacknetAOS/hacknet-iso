# Minimal Sway configuration for HacknetOS GUI Installer
output * bg #0b0e14 solid_color

default_border none
default_floating_border none
gaps inner 0
gaps outer 0

input * {
    xkb_layout us
    repeat_rate 25
    repeat_delay 300
}

exec sh -c 'GSK_RENDERER=cairo GDK_BACKEND=wayland /usr/local/bin/hacknetos-installer-gui >/tmp/hacknetos-gui-app.log 2>&1; swaymsg exit'
