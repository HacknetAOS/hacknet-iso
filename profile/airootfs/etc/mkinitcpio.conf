# vim:set ft=sh:
# Common drivers for broad hardware compatibility (VMware, VirtualBox, QEMU/KVM, bare metal)
MODULES=(loop squashfs
  # Storage / SCSI
  sd_mod scsi_mod ata_piix ahci libata vmw_pvscsi
  # VirtualBox
  vboxguest vboxsf vboxvideo
  # QEMU/KVM virtio
  virtio_blk virtio_scsi virtio_net virtio_console virtio_mmio
  # VMware
  vmw_vmci vmw_vsock_vmci_transport
  # Network
  e1000 e1000e vmxnet3
  # USB
  usb_storage xhci_hcd ehci_hcd ohci_hcd uhci_hcd
  # Filesystems
  ext4 jbd2 mbcache crc16
  # Graphics / display
  drm
  # Sound
  snd_hda_intel snd_usb_audio snd_usbmidi_lib)
BINARIES=()
FILES=()
HOOKS=(base udev modconf archiso block filesystems)
COMPRESSION="zstd"

