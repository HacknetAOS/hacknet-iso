# HacknetOS archiso pacman.conf
# See pacman.conf(5) for options

[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
# Auto-select default providers for virtual packages
IgnorePkg = iptables-legacy jack2

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# The HacknetOS local repository is intentionally not configured here.
# mkarchiso runs pacman inside the build chroot, where the host's pkg/ path does
# not exist; pointing a repository at it made dependency resolution fail. The
# local packages are installed from the airootfs package cache instead.
